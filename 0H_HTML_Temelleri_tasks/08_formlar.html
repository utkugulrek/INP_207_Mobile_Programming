<!-- GÖREV 8 – Formlar (Bölüm 1.8)
Görev: Bir <form> içinde kulüp başvuru formu kurun. Her alanın önünde, tıklanınca alanı seçen bir etiket olsun: etiketin for değeri, alanın id değeriyle aynı olmalı. Her alanın name değeri de id ile aynı olsun.

Ad: etiketi ve ad kimlikli zorunlu yazı alanı; içinde silik örnek Adınız. Ardından E-posta: etiketi ve eposta kimlikli e-posta alanı; içinde silik örnek ornek@email.com.
Yaş: etiketi ve yas kimlikli, yalnız 15 ile 25 arası sayı kabul eden alan.
Kulüp: etiketi ve kulup kimlikli açılır liste. İlk seçenek boş değerli Kulüp seçin olsun. Diğer seçenekler: Satranç (değeri satranc) ve Müzik (değeri muzik). Altında duyuru kimlikli onay kutusu; arkasında Duyuruları almak istiyorum yazan etiket.
Gönder (formu gönderen) ve Temizle (formu sıfırlayan) düğmeleri.
Her bölümden sonra bir satır boşluk bırakın.

Beklenen sonuç: etiketin yazısına tıklayınca ilgili alan seçilir; «Temizle» yazılanları siler. -->

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Form</h1>
    <form>
        <label for="name">Ad:</label>
        <input type="text" id="name" name="name" placeholder="Adınız" required>
        <label for="email">E-posta:</label>
        <input type="email" id="email" name="email" placeholder="ornek@email.com" required>
        <br>
        <br>
        <label for="age">Yaş:</label>
        <input type="number" id="age" name="age" min="15" max="25">
        <br>
        <br>
        <label for="kulup">Kulüp:</label>
        <select id="kulup" name="kulup">
            <option value="">Kulüp seçin</option>
            <option value="satranc">Satranç</option>
            <option value="muzik">Müzik</option>
        </select>
        <br>
        <br>
        <input type="checkbox" id="duyuru" name="duyuru">
        <label for="duyuru" >Duyuruları almak istiyorum</label>
        <button type="submit">Gönder</button>
        <button type="reset">Temizle</button>
    </form>
</body>
</html>
