<!-- GÖREV 3 – Metin Biçimlendirme (Bölüm 1.3)
Görev: Bir sınıf duyurusunu biçimlendirin.

Üç paragraf: Sınav cuma günü. (cuma günü kalın) · Kitabınızı getirin. (Kitabınızı eğik) · Önlük zorunludur. (zorunludur sarı işaretli).
Tek paragrafta iki satır: Yeditepe Üniversitesi, alt satırda İstanbul.
Yatay çizgi; altında iki paragraf: CO2 (2 alt indis) ve 10² = 100 (2 üst indis).
Sayfada aynen görünsün: <p> paragraf etiketidir.
Beklenen sonuç: 4. adımdaki cümlede «<p>» yazısı sayfada görünür. -->

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınıf Duyuru</title>
</head>
<body>
    <p>Sınav <b>cuma</b> günü.</p>
    <p> <i>Kitabınızı</i> getirin.</p>
    <p> <mark>Önlük</mark> zorunludur.</p>
    <p>Yeditepe Üniversitesi <br> İstanbul</p>
    <hr>
    <p>CO<sub>2</sub></p>
    <p>10<sup>2</sup> = 100</p>
    <p>&lt;p&gt; paragraf etiketidir.</p>
</body>
</html>
