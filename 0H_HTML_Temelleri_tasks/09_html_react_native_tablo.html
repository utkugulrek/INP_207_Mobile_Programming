<!-- GÖREV 9 – HTML ↔ React Native Tablosu (Bölüm 1.9)
Görev: İki etiketin React Native karşılığını bir tabloda gösterin.

Tablo, başlık hücreleri HTML ve React Native.
İki satır: <button> karşılığı <TouchableOpacity>, <input> karşılığı <TextInput>.
Etiket adları sayfada köşeli parantezleriyle ve kod harfiyle görünsün.
Beklenen sonuç: sayfada «<button>» yazısı görünür; düğme çizilmez. -->

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML ↔ React Native</title>
</head>
<body>
    <h1>HTML ↔ React Native Tablosu </h1>
    <table border="5">
        <thead>
            <tr>
                <th>HTML</th>
                <th>React Native</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>&lt;button&gt;</code></td>
                <td><code>&lt;TouchableOpacity&gt;</code></td>
            </tr>
            <tr>
                <td><code>&lt;input&gt;</code></td>
                <td><code>&lt;TextInput&gt;</code></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
