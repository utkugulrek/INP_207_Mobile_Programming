<!-- GÖREV 10 – HTML → RN Detaylı Karşılaştırma (Bölüm 1.10)
Görev: HTML ve React Native karşılıklarını iki kutuda yazın.

Dış kutu; içinde iki kutu, sınıfları html-kutu ve rn-kutu.
Kutulara 3. seviye başlık: HTML ve React Native.
html-kutu içine iki maddelik liste: <button> - Düğme, <input> - Giriş.
rn-kutu içine karşılıkları: <TouchableOpacity> - Düğme, <TextInput> - Giriş.
Beklenen sonuç: iki kutu alt alta; etiket adları köşeli parantezleriyle görünür. -->

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML → RN Detaylı</title>
</head>
<body>
    <h1>HTML → RN Detaylı Karşılaştırma</h1>
    <div class="html-kutu">
        <h3>HTML</h3>
        <ul>
            <li><code>&lt;button&gt;</code> - Düğme</li>
            <li><code>&lt;input&gt;</code> - Giriş</li>
        </ul>
    </div>
    <div class="rn-kutu">
        <h3>React Native</h3>
        <ul>
            <li><code>&lt;TouchableOpacity&gt;</code> - Düğme</li>
            <li><code>&lt;TextInput&gt;</code> - Giriş</li>
        </ul>
    </div>
</body>
</html>
